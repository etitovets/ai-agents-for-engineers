[project]
name = "oncall-mcp"
version = "0.1.0"
description = "Read-only MCP server for on-call incident investigation of the lesson_4 incident stand"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    # Pinned exactly: FastMCP releases regularly, and tool/annotation APIs move.
    "fastmcp==4.2.4",
    "psycopg[binary]==3.3.9",
    "psycopg-pool==3.3.3",
    "pydantic-settings==2.16.3",
]

[project.scripts]
oncall-mcp = "oncall_mcp.__main__:main"

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
    "ruff==0.17.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oncall_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error::DeprecationWarning:oncall_mcp.*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["lesson_4"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]
